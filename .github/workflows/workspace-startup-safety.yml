name: Workspace Startup Safety

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  editor-autostart:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Require executed, non-skipped generic contract tests
        run: |
          python -c "import ast,pathlib; t=ast.parse(pathlib.Path('tests/test_generic_model_boundary.py').read_text()); assert sum(isinstance(n,ast.FunctionDef) and n.name.startswith('test_') for n in ast.walk(t)) >= 8"
          python -c "import sys,unittest; sys.path.insert(0,'tests'); s=unittest.defaultTestLoader.loadTestsFromName('test_generic_model_boundary.GenericModelBoundaryTests'); r=unittest.TextTestRunner().run(s); assert r.wasSuccessful() and r.testsRun >= 8 and not r.skipped"
      - name: Reject hidden workspace autostart
        run: python -B -m unittest discover -s tests -v
